# Postgres 16 con la extensión pgvector. Solo escucha en localhost.
# Uso: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragdemo
      POSTGRES_PASSWORD: ${RAGDEMO_PASSWORD:-ragdemo}
      POSTGRES_DB: ragdemo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ragdemo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdemo -d ragdemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ragdemo_pg:
